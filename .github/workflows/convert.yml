name: Convert Loyalsoldier Rules to MRS

on:
  schedule:
    - cron: "15 23 * * *" # UTC 23:15 ≈ 北京时间 07:15（错开上游 06:00 / 06:30 构建）
  workflow_dispatch:
    inputs:
      force_publish:
        description: "即使规则无变化也强制重新发布"
        type: boolean
        default: false
      mihomo_version:
        description: "指定 mihomo 版本标签（默认 latest，如 v1.19.10）"
        type: string
        default: "latest"

permissions:
  contents: write

concurrency:
  group: convert-mrs
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download mihomo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQ_VERSION: ${{ inputs.mihomo_version || github.event.inputs.mihomo_version || 'latest' }}
        run: |
          set -euo pipefail
          REQ_VERSION="$(printf '%s' "$REQ_VERSION" | xargs)"
          if [ -z "$REQ_VERSION" ] || [ "$REQ_VERSION" = "latest" ]; then
            API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"
          else
            if [[ ! "$REQ_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Invalid mihomo_version input: ${REQ_VERSION}"
              exit 1
            fi
            API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${REQ_VERSION}"
          fi

          RELEASE_JSON=$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")

          MIHOMO_VERSION=$(jq -r '.tag_name // empty' <<< "$RELEASE_JSON")
          URL=$(jq -r '
            (
              [.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-v.*\\.gz$")) | .browser_download_url]
              + [.assets[] | select(.name | test("^mihomo-linux-amd64-v.*\\.gz$")) | .browser_download_url]
            ) | first // empty
          ' <<< "$RELEASE_JSON")

          if [[ ! "$MIHOMO_VERSION" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Failed to resolve valid mihomo version: ${MIHOMO_VERSION}"
            exit 1
          fi
          [ -n "$URL" ] || { echo "Failed to resolve mihomo download URL"; exit 1; }

          printf 'MIHOMO_VERSION=%s\n' "$MIHOMO_VERSION" >> "$GITHUB_ENV"
          echo "Downloading mihomo ${MIHOMO_VERSION}..."
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v

      - name: Download, Preprocess, Convert & Verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
