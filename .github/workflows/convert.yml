                          "src_name": "ip.txt",
                          "url": "https://raw.githubusercontent.com/Loyalsoldier/cn-blocked-domain/release/ip.txt",
                          "behavior": "ipcidr",
                          "mode": "plain_ip",
                          "desc": "中国大陆被屏蔽 IP 地址列表",
                          "allow_empty": True,
                      },
                      {
                          "out": "deduplicated-domains",
                          "src_name": "deduplicated-domains.txt",
                          "url": "https://raw.githubusercontent.com/Loyalsoldier/cn-blocked-domain/release/deduplicated-domains.txt",
                          "behavior": "domain",
                          "mode": "plain_domain",
                          "desc": "因父域名已存在而被移除的子域名",
                          "allow_empty": True,
                      },
                  ],
                  "extras": [],
              },
          ]

          LABEL_RE = re.compile(r"^[a-z0-9_](?:[a-z0-9_-]{0,61}[a-z0-9_])?$")
          ASCII_DOMAIN_RE = re.compile(
              r"^[a-z0-9_](?:[a-z0-9_-]{0,61}[a-z0-9_])?(?:\.[a-z0-9_](?:[a-z0-9_-]{0,61}[a-z0-9_])?)*$"
          )
          IPV4_LIKE_RE = re.compile(r"^\d+(?:\.\d+){3}$")
          CLASH_ITEM_RE = re.compile(r"^\s*-\s+\S+")
          BRACKET_IP_RE = re.compile(r"^\[([^\]]+)\](?::\d+)?$")

          def normalize_domain(domain: str) -> str | None:
              domain = domain.strip().strip(".").lower()
              if not domain or len(domain) > 253:
                  return None
              # Fast path for pure ASCII domains (99.9%+ of entries; avoids slow pure-Python IDNA codec)
              if domain.isascii():
                  if not ASCII_DOMAIN_RE.fullmatch(domain):
                      return None
                  if IPV4_LIKE_RE.fullmatch(domain):
                      try:
                          ipaddress.ip_address(domain)
                          return None
                      except ValueError:
                          pass
                  return domain

              out_labels = []
              for lbl in domain.split("."):
                  if not lbl:
                      return None
                  if not lbl.isascii():
                      try:
                          lbl = lbl.encode("idna").decode("ascii").lower()
                      except UnicodeError:
                          return None
                  if not LABEL_RE.fullmatch(lbl):
                      return None
                  out_labels.append(lbl)
              ascii_domain = ".".join(out_labels)
              if len(ascii_domain) > 253:
                  return None
              return ascii_domain

          def download(url: str, dest: pathlib.Path) -> None:
              dest.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [
                      "curl", "-fsSL",
                      "--retry", "3",
                      "--retry-delay", "2",
                      "--retry-all-errors",
                      "--connect-timeout", "15",
                      "--max-time", "60",
                      "-o", str(dest),
                      url,
                  ],
                  check=True,
              )

          def validate_clash_yaml(src: pathlib.Path) -> int:
              text = src.read_text(encoding="utf-8-sig", errors="strict")
              has_payload = False
              count = 0
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped == "payload:" or stripped.startswith("payload: "):
                      has_payload = True
                  elif CLASH_ITEM_RE.match(line):
                      count += 1
              if not has_payload or count == 0:
                  raise RuntimeError(f"Invalid or empty Clash YAML ruleset: {src}")
              return count

          def preprocess_plain_domain(src: pathlib.Path, dst: pathlib.Path) -> tuple[int, int, list[str]]:
              seen, skipped, samples = set(), 0, []
              for raw_line in src.read_text(encoding="utf-8-sig", errors="ignore").splitlines():
                  line = raw_line.split("#", 1)[0].strip().strip("'\"").lower()
                  if not line:
                      continue
                  if line.startswith("+."):
                      prefix, raw_dom = "+.", line[2:]
                  elif line.startswith("."):
                      prefix, raw_dom = ".", line[1:]
                  else:
                      prefix, raw_dom = "+.", line
                  norm = normalize_domain(raw_dom)
                  if not norm:
                      skipped += 1
                      if len(samples) < 5:
                          samples.append(raw_line.strip())
                      continue
                  seen.add(f"{prefix}{norm}")
              items = sorted(seen)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text("\n".join(items) + ("\n" if items else ""), encoding="utf-8")
              return len(items), skipped, samples

          def preprocess_v2ray_domain(src: pathlib.Path, dst: pathlib.Path) -> tuple[int, int, list[str]]:
              seen, skipped, samples = set(), 0, []
              for raw_line in src.read_text(encoding="utf-8-sig", errors="ignore").splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue
                  line = re.sub(r"\s+@\S+", "", line).strip().lower()
                  if not line:
                      continue
                  if line.startswith(("regexp:", "keyword:", "include:")):
                      skipped += 1
                      if len(samples) < 5:
                          samples.append(raw_line.strip())
                      continue
                  if line.startswith("full:"):
                      prefix, raw_dom = "", line[5:]
                  elif line.startswith("domain:"):
                      prefix, raw_dom = "+.", line[7:].lstrip("+.")
                  else:
                      prefix, raw_dom = "+.", line.lstrip("+.")
                  norm = normalize_domain(raw_dom)
                  if not norm:
                      skipped += 1
                      if len(samples) < 5:
                          samples.append(raw_line.strip())
                      continue
                  seen.add(f"{prefix}{norm}")
              items = sorted(seen)
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text("\n".join(items) + ("\n" if items else ""), encoding="utf-8")
              return len(items), skipped, samples

          def parse_ip_entry(raw_line: str) -> list[ipaddress.IPv4Network | ipaddress.IPv6Network]:
              line = raw_line.split("#", 1)[0].strip()
              if not line:
                  return []
              if line.startswith("- "):
                  line = line[2:].strip()
              line = line.strip("'\"")
              if not line or line.lower() == "payload:":
                  return []
              upper = line.upper()
              if upper.startswith(("IP-CIDR,", "IP-CIDR6,")):
                  line = line.split(",", 2)[1].strip()
              elif upper.startswith("IP:"):
                  line = line[3:].strip()
              elif "," in line:
                  line = line.split(",", 1)[0].strip()
              line = line.split()[0].strip("'\"")
              m = BRACKET_IP_RE.match(line)
              if m:
                  line = m.group(1)
              elif line.count(":") == 1:
                  host, port = line.split(":", 1)
                  if port.isdigit():
                      line = host
              if "-" in line and "/" not in line:
                  left, right = line.split("-", 1)
                  try:
                      start_ip = ipaddress.ip_address(left.strip())
                      end_ip = ipaddress.ip_address(right.strip())
                      if start_ip.version == end_ip.version and start_ip <= end_ip:
                          return list(ipaddress.summarize_address_range(start_ip, end_ip))
                  except ValueError:
                      pass
              try:
                  return [ipaddress.ip_network(line, strict=False)]
              except ValueError:
                  return []

          def preprocess_plain_ip(src: pathlib.Path, dst: pathlib.Path) -> tuple[int, int, list[str]]:
              v4_nets, v6_nets, skipped, samples = [], [], 0, []
              for raw_line in src.read_text(encoding="utf-8-sig", errors="ignore").splitlines():
                  cleaned = raw_line.split("#", 1)[0].strip()
                  if not cleaned:
                      continue
                  nets = parse_ip_entry(raw_line)
                  if not nets:
                      skipped += 1
                      if len(samples) < 5:
                          samples.append(raw_line.strip())
                      continue
                  for net in nets:
                      if isinstance(net, ipaddress.IPv4Network):
                          v4_nets.append(net)
                      else:
                          v6_nets.append(net)
              collapsed = [str(n) for n in ipaddress.collapse_addresses(v4_nets)] + [
                  str(n) for n in ipaddress.collapse_addresses(v6_nets)
              ]
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_text("\n".join(collapsed) + ("\n" if collapsed else ""), encoding="utf-8")
              return len(collapsed), skipped, samples

          def human_size(num_bytes: int) -> str:
              size = float(num_bytes)
              for unit in ("B", "KB", "MB", "GB"):
                  if size < 1024 or unit == "GB":
                      return f"{int(size)} {unit}" if unit == "B" else f"{size:.1f} {unit}"
                  size /= 1024
              return f"{num_bytes} B"

          def process_rule(sid: str, rule: dict) -> dict:
              out_stem = rule["out"]
              mrs_name = f"{out_stem}.mrs"
              raw_path = RAW_DIR / sid / f"{out_stem}.txt"
              src_out_dir = OUT_DIR / sid
              src_out_dir.mkdir(parents=True, exist_ok=True)
              out_path = src_out_dir / mrs_name
              allow_empty = rule.get("allow_empty", False)

              mode = rule["mode"]
              skipped = 0
              samples: list[str] = []
              if mode == "clash_yaml":
                  count = validate_clash_yaml(raw_path)
                  src_for_mihomo = raw_path
                  mihomo_fmt = "yaml"
              else:
                  clean_path = CLEAN_DIR / sid / f"{out_stem}.txt"
                  if mode == "plain_domain":
                      count, skipped, samples = preprocess_plain_domain(raw_path, clean_path)
                  elif mode == "v2ray_domain":
                      count, skipped, samples = preprocess_v2ray_domain(raw_path, clean_path)
                  elif mode == "plain_ip":
                      count, skipped, samples = preprocess_plain_ip(raw_path, clean_path)
                  else:
                      raise RuntimeError(f"Unknown mode: {mode}")

                  if count == 0:
                      raw_bytes = raw_path.stat().st_size
                      diag = f"raw_bytes={raw_bytes}, skipped={skipped}, samples={samples}"
                      if allow_empty:
                          print(f"  WARN: [{sid}] {rule['src_name']} has 0 valid entries ({diag}), skipping MRS.")
                          return {
                              **rule,
                              "mrs": mrs_name,
                              "status": "empty",
                              "size": "-",
                              "count": 0,
                              "skipped": skipped,
                          }
                      raise RuntimeError(f"Zero valid entries after preprocessing ({diag}): {rule['url']}")
                  src_for_mihomo = clean_path
                  mihomo_fmt = "text"

              subprocess.run(
                  ["./mihomo", "convert-ruleset", rule["behavior"], mihomo_fmt, str(src_for_mihomo), str(out_path)],
                  check=True,
              )
              if not out_path.exists() or out_path.stat().st_size == 0:
                  raise RuntimeError(f"Empty MRS output: {out_path}")

              size_str = human_size(out_path.stat().st_size)
              print(f"  OK: {sid}/{mrs_name} ({count} rules, {size_str}, skipped={skipped})")
              return {
                  **rule,
                  "mrs": mrs_name,
                  "status": "ok",
                  "size": size_str,
                  "count": count,
                  "skipped": skipped,
              }

          # 1. Parallel download into per-source subdirectories (no filename collisions)
          download_tasks = [
              (rule["url"], RAW_DIR / source["id"] / f"{rule['out']}.txt", source["id"], rule["src_name"])
              for source in SOURCES
              for rule in source["rules"]
          ]
          print(f"Downloading {len(download_tasks)} upstream rule files in parallel...")
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures = {
                  pool.submit(download, url, dest): (sid, sname, url)
                  for url, dest, sid, sname in download_tasks
              }
              for fut in concurrent.futures.as_completed(futures):
                  sid, sname, url = futures[fut]
                  try:
                      fut.result()
                      print(f"  Downloaded [{sid}] {sname}")
                  except Exception as exc:
                      sys.exit(f"Failed downloading [{sid}] {sname} ({url}): {exc}")

          # 2. Parallel preprocess & mihomo convert across CPU cores, reassembled in deterministic order
          cpu_workers = max(2, min(4, os.cpu_count() or 4))
          print(f"Converting rules with {cpu_workers} parallel workers...")
          indexed_tasks = [
              (s_idx, r_idx, source["id"], rule)
              for s_idx, source in enumerate(SOURCES)
              for r_idx, rule in enumerate(source["rules"])
          ]
          results_map: dict[tuple[int, int], dict] = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=cpu_workers) as pool:
              futures = {
                  pool.submit(process_rule, sid, rule): (s_idx, r_idx, sid, rule["src_name"])
                  for s_idx, r_idx, sid, rule in indexed_tasks
              }
              for fut in concurrent.futures.as_completed(futures):
                  s_idx, r_idx, sid, sname = futures[fut]
                  try:
                      results_map[(s_idx, r_idx)] = fut.result()
                  except Exception as exc:
                      sys.exit(f"Failed converting [{sid}] {sname}: {exc}")

          # 3. Deterministic manifest & per-source + global SHA256 checksums
          manifest = []
          global_checksum_lines = []
          for s_idx, source in enumerate(SOURCES):
              sid = source["id"]
              src_out_dir = OUT_DIR / sid
              src_rules = [results_map[(s_idx, r_idx)] for r_idx in range(len(source["rules"]))]

              src_checksums = []
              for mrs_file in sorted(src_out_dir.glob("*.mrs"), key=lambda p: p.name):
                  digest = hashlib.sha256(mrs_file.read_bytes()).hexdigest()
                  src_checksums.append(f"{digest}  {mrs_file.name}")
                  global_checksum_lines.append(f"{digest}  {sid}/{mrs_file.name}")
              if not src_checksums:
                  sys.exit(f"Source {sid} produced 0 MRS files")
              (src_out_dir / "checksums.sha256").write_text("\n".join(src_checksums) + "\n", encoding="utf-8")

              manifest.append({
                  "id": sid,
                  "tag": source["tag"],
                  "title": source["title"],
                  "is_latest": source["is_latest"],
                  "name": source["name"],
                  "repo_url": source["repo_url"],
                  "sample_mrs": source["sample_mrs"],
                  "description": source["description"],
                  "rules": src_rules,
                  "extras": source["extras"],
              })

          global_checksum_lines.sort(key=lambda line: line.split("  ", 1)[1])
          (OUT_DIR / "checksums.sha256").write_text("\n".join(global_checksum_lines) + "\n", encoding="utf-8")
          pathlib.Path("build_manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(f"Total MRS files built across {len(manifest)} sources: {len(global_checksum_lines)}")
          PY

      - name: Detect changes (branch & each release independently)
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FORCE_PUBLISH: ${{ inputs.force_publish || github.event.inputs.force_publish || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.request

          gh_token = os.environ["GH_TOKEN"]
          gh_repo = os.environ["GH_REPO"]
          force_publish = os.environ.get("FORCE_PUBLISH", "false").lower() == "true"
          manifest = json.loads(pathlib.Path("build_manifest.json").read_text(encoding="utf-8"))

          # Non-latest releases first, is_latest release last
          ordered_sources = sorted(manifest, key=lambda s: (bool(s["is_latest"]), s["tag"]))

          def api_get(url: str, accept: str = "application/vnd.github+json") -> tuple[int, bytes]:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": accept,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "clash-rules-mrs-workflow",
                  },
              )
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.status, resp.read()
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return 404, b""
                      if exc.code >= 500 or exc.code == 429:
                          if attempt < 3:
                              time.sleep(2 * attempt)
                              continue
                      raise RuntimeError(f"GitHub API HTTP {exc.code} for {url}: {exc.read().decode('utf-8', 'ignore')[:300]}")
                  except urllib.error.URLError as exc:
                      if attempt < 3:
                          time.sleep(2 * attempt)
                          continue
                      raise RuntimeError(f"GitHub API network error for {url}: {exc}")
              raise RuntimeError(f"Unreachable retry state for {url}")

          if force_publish:
              branch_changed = True
              changed_tags = [s["tag"] for s in ordered_sources]
              print("Force publish enabled for orphan branch and all releases.")
          else:
              # 1. Check orphan release branch via single lightweight Contents API call
              local_global = pathlib.Path("out/checksums.sha256").read_bytes()
              status, remote_global = api_get(
                  f"https://api.github.com/repos/{gh_repo}/contents/checksums.sha256?ref=release",
                  accept="application/vnd.github.raw+json",
              )
              branch_changed = (status == 404) or (remote_global != local_global)

              # 2. Check each Release independently (1 metadata call + 1 small checksum download)
              changed_tags = []
              for src in ordered_sources:
                  tag = src["tag"]
                  sid = src["id"]
                  src_dir = pathlib.Path("out") / sid
                  local_sha = (src_dir / "checksums.sha256").read_bytes()
                  expected_assets = sorted([*(p.name for p in src_dir.glob("*.mrs")), "checksums.sha256"])

                  status, body = api_get(f"https://api.github.com/repos/{gh_repo}/releases/tags/{tag}")
                  rel_changed = True
                  if status == 200:
                      rel = json.loads(body.decode("utf-8"))
                      assets = rel.get("assets", [])
                      remote_names = sorted(a["name"] for a in assets)
                      sha_asset = next((a for a in assets if a["name"] == "checksums.sha256"), None)
                      if remote_names == expected_assets and sha_asset is not None:
                          sha_status, remote_sha = api_get(sha_asset["url"], accept="application/octet-stream")
                          if sha_status == 200 and remote_sha == local_sha:
                              rel_changed = False
                  print(f"release[{tag}]_changed={'true' if rel_changed else 'false'}")
                  if rel_changed:
                      changed_tags.append(tag)

          any_release_changed = len(changed_tags) > 0
          print(f"branch_changed={'true' if branch_changed else 'false'}")
          print(f"changed_releases={' '.join(changed_tags)}")

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"branch_changed={'true' if branch_changed else 'false'}\n")
              fh.write(f"changed_releases={' '.join(changed_tags)}\n")
              fh.write(f"any_release_changed={'true' if any_release_changed else 'false'}\n")
          PY

      - name: Generate release notes & branch README
        if: steps.diff.outputs.branch_changed == 'true' || steps.diff.outputs.any_release_changed == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib

          gh_repo = os.environ["GH_REPO"]
          mihomo_version = os.environ["MIHOMO_VERSION"]
          now_utc = datetime.datetime.now(datetime.timezone.utc)
          now_cst = now_utc + datetime.timedelta(hours=8)
          time_str = f"{now_cst:%Y-%m-%d %H:%M} (UTC+8) / {now_utc:%Y-%m-%d %H:%M} UTC"

          manifest = json.loads(pathlib.Path("build_manifest.json").read_text(encoding="utf-8"))
          notes_dir = pathlib.Path("notes")
          notes_dir.mkdir(parents=True, exist_ok=True)

          def pick_sample_mrs(src: dict) -> str:
              ok_names = [r["mrs"] for r in src["rules"] if r["status"] == "ok"]
              if src["sample_mrs"] in ok_names:
                  return src["sample_mrs"]
              return ok_names[0] if ok_names else src["sample_mrs"]

          def render_route_examples(src: dict) -> list[str]:
              tag = src["tag"]
              sid = src["id"]
              sample = pick_sample_mrs(src)
              return [
                  f"- **GitHub Releases 直链（走代理首选，实时更新）：** https://github.com/{gh_repo}/releases/download/{tag}/{sample}",
                  f"- **GitHub Raw 直链（与孤儿分支强一致，实时更新）：** https://raw.githubusercontent.com/{gh_repo}/release/{sid}/{sample}",
                  f"- **jsDelivr CDN 线路（直连友好，存在约 12 小时缓存）：** https://cdn.jsdelivr.net/gh/{gh_repo}@release/{sid}/{sample}",
              ]

          def render_rule_table(src: dict) -> list[str]:
              tag = src["tag"]
              sid = src["id"]
              rows = [
                  "| MRS 文件 | 类型 | 条目数 | 大小 | 说明与原始文件 | 订阅地址 |",
                  "| :--- | :---: | ---: | ---: | :--- | :---: |",
              ]
              for r in src["rules"]:
                  mrs = r["mrs"]
                  desc_cell = f"{r['desc']}（[{r['src_name']}]({r['url']})）"
                  if r.get("skipped"):
                      desc_cell += f" · 已过滤 {r['skipped']} 条非 MRS 规则"
                  count_cell = f"{r['count']:,}" if isinstance(r.get("count"), int) else "-"
                  if r["status"] == "ok":
                      rel_url = f"https://github.com/{gh_repo}/releases/download/{tag}/{mrs}"
                      raw_url = f"https://raw.githubusercontent.com/{gh_repo}/release/{sid}/{mrs}"
                      cdn_url = f"https://cdn.jsdelivr.net/gh/{gh_repo}@release/{sid}/{mrs}"
                      links = f"[Releases]({rel_url}) · [Raw]({raw_url}) · [CDN]({cdn_url})"
                      rows.append(f"| `{mrs}` | `{r['behavior']}` | {count_cell} | {r['size']} | {desc_cell} | {links} |")
                  else:
                      rows.append(f"| `{mrs}` | `{r['behavior']}` | 0 | - | {desc_cell} | 当日上游无有效条目 |")
              return rows

          def render_extras(src: dict) -> list[str]:
              if not src["extras"]:
                  return []
              out = ["", "**其他原文件（非 MRS，请直接引用上游地址）：**"]
              for ex in src["extras"]:
                  out.append(f"- **{ex['name']}**：{ex['url']}  \n  {ex['note']}")
              return out

          # 1. Per-source Release Notes (each source uses its own tag, directory & sample .mrs)
          for src in manifest:
              tag = src["tag"]
              sample = pick_sample_mrs(src)
              ok_count = sum(1 for r in src["rules"] if r["status"] == "ok")
              other_links = " · ".join(
                  f"[`{other['tag']}`](https://github.com/{gh_repo}/releases/tag/{other['tag']})"
                  for other in manifest
                  if other["tag"] != tag
              )

              lines = [
                  "## Build Info",
                  f"- **Updated:** {time_str}",
                  f"- **Mihomo Version:** `{mihomo_version}`",
                  f"- **MRS Rules:** {ok_count}",
                  f"- **其他规则发布页：** {other_links}",
                  "",
                  "## 来源说明",
                  f"- **上游仓库：** {src['repo_url']}",
                  f"- **简介：** {src['description']}",
                  "",
                  f"## 订阅线路说明（{src['title']}）",
                  f"以下以本来源的 `{sample}` 为例，将末尾文件名替换为下方任意 `.mrs` 文件名即可使用：",
                  "",
                  *render_route_examples(src),
                  "",
                  "## 规则文件清单",
                  "",
              ]
              lines.extend(render_rule_table(src))
              lines.extend(render_extras(src))
              lines.append("")
              (notes_dir / f"{tag}.md").write_text("\n".join(lines), encoding="utf-8")

          # 2. Master README for the orphan release branch & workflow summary (per-source examples)
          total_mrs = sum(1 for s in manifest for r in s["rules"] if r["status"] == "ok")
          master = [
              "# Loyalsoldier Rules (MRS)",
              "",
              "## Build Info",
              f"- **Updated:** {time_str}",
              f"- **Mihomo Version:** `{mihomo_version}`",
              f"- **Total MRS Rules:** {total_mrs}",
              "",
              "## 独立发布页导航",
          ]
          for src in manifest:
              ok_count = sum(1 for r in src["rules"] if r["status"] == "ok")
              master.append(
                  f"- **{src['title']}**（{ok_count} 个 MRS）："
                  f"[Release `{src['tag']}`](https://github.com/{gh_repo}/releases/tag/{src['tag']}) · "
                  f"分支目录 `{src['id']}/`"
              )

          master.extend([
              "",
              "## 订阅线路说明（按来源分目录 / 独立 Release）",
              "以下按三个来源分别举例，将示例链接末尾的文件名替换为对应来源清单中的任意 `.mrs` 文件名即可使用：",
              "",
          ])
          for src in manifest:
              sample = pick_sample_mrs(src)
              master.append(f"### {src['title']}（以 `{sample}` 为例）")
              master.extend(render_route_examples(src))
              master.append("")

          master.append("## 规则来源与文件清单")
          master.append("")

          for idx, src in enumerate(manifest, 1):
              master.append(f"### {idx}. {src['title']}")
              master.append(f"- **来源：** {src['repo_url']}")
              master.append(f"- **独立发布页：** https://github.com/{gh_repo}/releases/tag/{src['tag']}")
              master.append(f"- **说明：** {src['description']}")
              master.append("")
              master.extend(render_rule_table(src))
              master.extend(render_extras(src))
              master.append("")

          pathlib.Path("branch_readme.md").write_text("\n".join(master), encoding="utf-8")
          PY

      - name: Publish to orphan release branch
        if: steps.diff.outputs.branch_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p publish_branch
          cp -a out/. publish_branch/
          cp -f branch_readme.md publish_branch/README.md
          cd publish_branch
          git init -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update MRS rules $(date -u '+%Y-%m-%d %H:%M UTC') (${MIHOMO_VERSION})"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::${BASIC_AUTH}"

          attempt=1
          until git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" release:release; do
            if [ "$attempt" -ge 3 ]; then
              echo "git push failed after 3 attempts"
              exit 1
            fi
            echo "git push attempt ${attempt} failed, retrying in 5s..."
            sleep 5
            attempt=$((attempt + 1))
          done

      - name: Sync independent GitHub Releases
        if: steps.diff.outputs.any_release_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CHANGED_RELEASES: ${{ steps.diff.outputs.changed_releases }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request

          gh_token = os.environ["GH_TOKEN"]
          gh_repo = os.environ["GH_REPO"]
          changed_tags = [t for t in os.environ.get("CHANGED_RELEASES", "").split() if t]
          manifest = {s["tag"]: s for s in json.loads(pathlib.Path("build_manifest.json").read_text(encoding="utf-8"))}

          def api_json(url: str) -> tuple[int, dict | None]:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {gh_token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "clash-rules-mrs-workflow",
                  },
              )
              for attempt in range(1, 4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          return resp.status, json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      if exc.code == 404:
                          return 404, None
                      if exc.code >= 500 or exc.code == 429:
                          if attempt < 3:
                              time.sleep(2 * attempt)
                              continue
                      raise RuntimeError(f"GitHub API HTTP {exc.code} for {url}: {exc.read().decode('utf-8', 'ignore')[:300]}")
                  except urllib.error.URLError as exc:
                      if attempt < 3:
                          time.sleep(2 * attempt)
                          continue
                      raise RuntimeError(f"GitHub API network error for {url}: {exc}")
              raise RuntimeError(f"Unreachable retry state for {url}")

          def run_retry(cmd: list[str], max_attempts: int = 3) -> None:
              for attempt in range(1, max_attempts + 1):
                  res = subprocess.run(cmd)
                  if res.returncode == 0:
                      return
                  if attempt == max_attempts:
                      raise RuntimeError(f"Command failed after {max_attempts} attempts: {' '.join(cmd)}")
                  print(f"Attempt {attempt} failed, retrying in 5s...")
                  time.sleep(5)

          repo_status, repo_info = api_json(f"https://api.github.com/repos/{gh_repo}")
          if repo_status != 200 or not repo_info:
              raise RuntimeError(f"Failed to query repo metadata for {gh_repo}")
          default_branch = repo_info["default_branch"]

          for tag in changed_tags:
              src = manifest[tag]
              sid = src["id"]
              title = src["title"]
              is_latest = bool(src["is_latest"])
              src_dir = pathlib.Path("out") / sid
              mrs_files = sorted(src_dir.glob("*.mrs"), key=lambda p: p.name)
              sha_file = src_dir / "checksums.sha256"
              notes_file = pathlib.Path("notes") / f"{tag}.md"

              print(f"=== Syncing Release [{tag}] ({len(mrs_files)} MRS + checksums) ===")

              # 1. Idempotently ensure Release exists (create empty first so upload retries never hit "already exists")
              rel_status, rel_info = api_json(f"https://api.github.com/repos/{gh_repo}/releases/tags/{tag}")
              created_now = False
              if rel_status == 404:
                  create_cmd = [
                      "gh", "release", "create", tag,
                      "--repo", gh_repo,
                      "--target", default_branch,
                      "--title", title,
                      "--notes-file", str(notes_file),
                      "--latest" if is_latest else "--latest=false",
                  ]
                  run_retry(create_cmd)
                  created_now = True
                  rel_status, rel_info = api_json(f"https://api.github.com/repos/{gh_repo}/releases/tags/{tag}")

              # 2. Upload all .mrs assets first (without checksums.sha256 yet)
              run_retry(
                  ["gh", "release", "upload", tag, *[str(p) for p in mrs_files], "--repo", gh_repo, "--clobber"]
              )

              # 3. Clean up stale remote assets not in local output
              expected_names = {p.name for p in mrs_files} | {"checksums.sha256"}
              remote_assets = [a["name"] for a in (rel_info or {}).get("assets", [])]
              for asset_name in remote_assets:
                  if asset_name not in expected_names:
                      print(f"Removing stale release asset from [{tag}]: {asset_name}")
                      run_retry(["gh", "release", "delete-asset", tag, asset_name, "--repo", gh_repo, "--yes"])

              # 4. Update title, release notes, and latest flag (only assert --latest on primary release)
              if not created_now:
                  edit_cmd = [
                      "gh", "release", "edit", tag,
                      "--repo", gh_repo,
                      "--title", title,
                      "--notes-file", str(notes_file),
                  ]
                  if is_latest:
                      edit_cmd.append("--latest")
                  run_retry(edit_cmd)

              # 5. Upload checksums.sha256 LAST as an atomic commit marker for self-healing detection
              run_retry(["gh", "release", "upload", tag, str(sha_file), "--repo", gh_repo, "--clobber"])
          PY

      - name: Write workflow summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          BRANCH_CHANGED: ${{ steps.diff.outputs.branch_changed }}
          CHANGED_RELEASES: ${{ steps.diff.outputs.changed_releases }}
        run: |
          set -euo pipefail
          [ -f build_manifest.json ] || exit 0
          if [ "$DIFF_OUTCOME" != "success" ]; then
            BRANCH_STATUS="未执行（前置步骤失败）"
            RELEASE_STATUS="未执行（前置步骤失败）"
          else
            BRANCH_STATUS="无变化（跳过）"
            [ "$BRANCH_CHANGED" = "true" ] && BRANCH_STATUS="已更新"
            RELEASE_STATUS="无变化（跳过）"
            [ -n "$CHANGED_RELEASES" ] && RELEASE_STATUS="已更新 (${CHANGED_RELEASES})"
          fi
          {
            printf '%s\n' '## MRS 构建摘要'
            printf -- '- **任务状态：** `%s`\n' "${JOB_STATUS:-unknown}"
            printf -- '- **Mihomo 版本：** `%s`\n' "${MIHOMO_VERSION:-unknown}"
            printf -- '- **孤儿分支 (`release`)：** %s\n' "$BRANCH_STATUS"
            printf -- '- **独立 Releases：** %s\n' "$RELEASE_STATUS"
            printf '\n'
            if [ -f branch_readme.md ]; then
              cat branch_readme.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
