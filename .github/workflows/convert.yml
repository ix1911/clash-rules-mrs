                  "name": "Loyalsoldier/cn-blocked-domain",
                  "repo_url": "https://github.com/Loyalsoldier/cn-blocked-domain",
                  "sample_mrs": "domains.mrs",
                  "description": (
                      "通过 GreatFire Analyzer 的 JSON API"
                      "（https://en.greatfire.org/api/tags?status=blocked）"
                      "获取在中国大陆被屏蔽的域名和 IP 地址，并进行校验、去重与聚合。"
                  ),
                  "rules": [
                      {
                          "out": "domains",
                          "src_name": "domains.txt",
                          "url": "https://raw.githubusercontent.com/Loyalsoldier/cn-blocked-domain/release/domains.txt",
                          "behavior": "domain",
                          "mode": "plain_domain",
                          "desc": "中国大陆被屏蔽域名列表",
